name: OCI ARM Sniper Loop

on:
#  schedule:
#    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-sniper-group
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decrypt OCI Private Key File
        env:
          PASSPHRASE: ${{ secrets.OCI_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.oci
          gpg --quiet --batch --yes --decrypt --passphrase "$PASSPHRASE" \
            --output ~/.oci/oci_api_key.pem \
            python_script/2026-07-26T17_31_09.593Z.pem.gpg
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Run Sniper Loop
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_FILE: /home/runner/.oci/oci_api_key.pem
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: |
          for i in {1..10}; do
            echo "--- Tembakan ke-$i ---"
            python python_script/Ampere_A1_12gbram_2ocpu.py || true
            sleep 30
          done
