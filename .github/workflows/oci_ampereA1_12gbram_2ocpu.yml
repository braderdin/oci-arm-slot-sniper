name: OCI ARM Sniper Loop (Every 15 Mins)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-arm-sniper-group
  cancel-in-progress: false

jobs:
  snipe-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decrypt All 5 GPG Key Files
        env:
          PASSPHRASE: ${{ secrets.OCI_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.oci ~/.ssh

          # 1. API Private Key (.pem)
          gpg --quiet --batch --yes --decrypt --passphrase "$PASSPHRASE" \
            --output ~/.oci/oci_api_key.pem \
            python_script/braderdin007@gmail.com-2026-07-26T17_31_09.593Z.pem.gpg
          chmod 600 ~/.oci/oci_api_key.pem

          # 2. API Public Key (.pem)
          gpg --quiet --batch --yes --decrypt --passphrase "$PASSPHRASE" \
            --output ~/.oci/oci_api_key_public.pem \
            python_script/braderdin007@gmail.com-2026-07-26T17_31_13.660Z_public.pem.gpg

          # 3. SSH Private Key
          gpg --quiet --batch --yes --decrypt --passphrase "$PASSPHRASE" \
            --output ~/.ssh/ssh-key-2026-07-27.key \
            python_script/ssh-key-2026-07-27.key.gpg
          chmod 600 ~/.ssh/ssh-key-2026-07-27.key

          # 4. SSH Public Key (.pub)
          gpg --quiet --batch --yes --decrypt --passphrase "$PASSPHRASE" \
            --output python_script/ssh-key-2026-07-27.key.pub \
            python_script/ssh-key-2026-07-27.key.pub.gpg

          # 5. Token File
          gpg --quiet --batch --yes --decrypt --passphrase "$PASSPHRASE" \
            --output python_script/tokens.tok \
            python_script/tokens.tok.gpg

      - name: Run ARM Sniper Loop
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_FILE: /home/runner/.oci/oci_api_key.pem
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          GPG_PASSPHRASE: ${{ secrets.OCI_KEY_PASSPHRASE }}
        run: |
          for i in {1..10}; do
            echo "🎯 --- Tembakan ARM ke-$i ---"
            python python_script/Ampere_A1_12gbram_2ocpu.py || true
            sleep 30
          done