name: OCI ARM Upgrade Loop (Every 25 Mins)

on:
#  schedule:
#    - cron: '*/25 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-arm-upgrade-group
  cancel-in-progress: false

jobs:
  upgrade-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decrypt OCI Private Key File
        env:
          PASSPHRASE: ${{ secrets.OCI_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.oci
          gpg --quiet --batch --yes --decrypt --passphrase "$PASSPHRASE" \
            --output ~/.oci/oci_api_key.pem \
            python_script/braderdin007@gmail.com-2026-07-26T17_31_09.593Z.pem.gpg
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Step 1 - Check Upgrade Status
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_FILE: /home/runner/.oci/oci_api_key.pem
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: python python_script/check_arm_upgrade_status.py

      - name: Step 2 - Run ARM Upgrade Loop
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_FILE: /home/runner/.oci/oci_api_key.pem
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: |
          for i in {1..20}; do
            echo "🎯 --- Tembakan Upgrade ke-$i ---"
            python python_script/upgrade_arm_vm.py || true
            sleep 30
          done