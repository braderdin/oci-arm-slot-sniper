name: OCI ARM Auto Sniper (Classic Pure 100%)

on:
#  schedule:
    # 3x Offset Timing untuk pintas pelepasan slot OCI di Singapore
#    - cron: '0,15,30,45 * * * *'   # Standard quarters
#    - cron: '2,17,32,47 * * * *'   # Offset +2 min
#    - cron: '5,20,35,50 * * * *'   # Offset +5 min
  workflow_dispatch: # Boleh run manual bila-bila masa

jobs:
  auto-snipe-job:
    runs-on: ubuntu-latest
    name: Run OCI Apply Job & Notify

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}

    steps:
      # 1. Trigger OCI Stack Apply Job (Sama 100% macam kod lama korang)
      - name: Trigger OCI Stack Apply Job
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'resource-manager job create-apply-job --stack-id ${{ secrets.OCI_STACK_ID }} --execution-plan-strategy AUTO_APPROVED --display-name "Auto-Snipe-Task"'
          silent: false

      # 2. Delay 30 Saat (Bagi masa OCI Resource Manager hantar task ke backend)
      - name: Delay 30 Seconds
        run: sleep 30

      # 3. Semak jika VM Ampere ARM dah berstatus RUNNING (Sama 100% macam kod lama)
      - name: Check Running Instances
        id: check_vm
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'compute instance list --compartment-id ${{ secrets.OCI_TENANCY }} --lifecycle-state RUNNING'
          silent: true

      # 4. Hantar Telegram Alert HANYA jika VM.Standard.A1.Flex dijumpai
      - name: Send Telegram Alert
        if: contains(steps.check_vm.outputs.output, 'VM.Standard.A1.Flex')
        run: |
          MESSAGE="🚀 *TAHNIAH BRO! VM OCI ARM BERJAYA DICIPTA!*%0A%0AStatus: *RUNNING*%0ASpecification: 2 OCPU / 12 GB RAM / 200 GB Storage%0ARegion: *${{ secrets.OCI_REGION }}*%0A%0ASila log masuk ke OCI Console sekarang!"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown"