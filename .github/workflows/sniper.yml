name: OCI ARM Auto Sniper

on:
  schedule:
    # Berjalan automatik setiap 15 minit 24/7 di cloud GitHub
    - cron: '*/15 * * * *'
  workflow_dispatch: # Membolehkan korang tekan 'Run workflow' secara manual pada bila-bila masa

jobs:
  auto-snipe-job:
    runs-on: ubuntu-latest
    name: Run OCI Apply Job & Notify

    steps:
      # 1. Setup OCI CLI
      - name: Setup OCI CLI
        uses: oracle-actions/setup-oci-cli@v1.3.2
        with:
          user: ${{ secrets.OCI_USER }}
          tenancy: ${{ secrets.OCI_TENANCY }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          region: ${{ secrets.OCI_REGION }}
          api_key: ${{ secrets.OCI_KEY_CONTENT }}

      # 2. Hantar arahan Apply ke OCI Stack
      - name: Trigger OCI Stack Apply Job
        run: |
          oci resource-manager job create-apply-job \
            --stack-id ${{ secrets.OCI_STACK_ID }} \
            --execution-plan-strategy AUTO_APPROVED \
            --display-name "Auto-Snipe-Task"

      # 3. Semak jika VM telah bertukar status ke RUNNING
      - name: Check if VM Status is RUNNING
        id: check_vm
        run: |
          RUNNING_VM=$(oci compute instance list \
            --compartment-id ${{ secrets.OCI_TENANCY }} \
            --lifecycle-state RUNNING \
            --query "data[?shape=='VM.Standard.A1.Flex'].id" \
            --raw-output)

          if [ -n "$RUNNING_VM" ] && [ "$RUNNING_VM" != "[]" ]; then
            echo "IS_RUNNING=true" >> $GITHUB_OUTPUT
          else
            echo "IS_RUNNING=false" >> $GITHUB_OUTPUT
          fi

      # 4. Hantar Notifikasi ke Telegram jika VM DAH SIAP!
      - name: Send Telegram Alert
        if: steps.check_vm.outputs.IS_RUNNING == 'true'
        run: |
          MESSAGE="🚀 *TAHNIAH BRO! VM OCI ARM DAH SIAP!*%0A%0AStatus: *RUNNING*%0ASpecification: 4 OCPU / 24 GB RAM / 200 GB Storage%0A%0ASila log masuk ke OCI Console sekarang untuk dapatkan Public IP VM korang!"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown"